{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create User | Backorder AI</title>

    <style>

        /* ============================================================
           RESET
        ============================================================ */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }


        /* ============================================================
           WHITE LILAC + DARK BLUE PALETTE

           Background   : #F8F8F9
           Dark Blue    : #111439
           Indigo       : #252A68
           Soft Blue    : #5D66C8
           Light Lilac  : #EEF0FF
           Border       : #E2E4F0
           Muted        : #686D88
        ============================================================ */


        /* ============================================================
           BODY
        ============================================================ */

        body {

            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(93, 102, 200, 0.16),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(37, 42, 104, 0.12),
                    transparent 40%
                ),
                linear-gradient(
                    135deg,
                    #F8F8F9 0%,
                    #F4F4FA 50%,
                    #F8F8F9 100%
                );

            background-attachment: fixed;

            color: #111439;

            min-height: 100vh;

            display: flex;
            flex-direction: column;

            position: relative;

            overflow-x: hidden;
        }


        /* ============================================================
           ANIMATED BACKGROUND ORBS
        ============================================================ */

        .orb {

            position: fixed;

            border-radius: 50%;

            filter: blur(80px);

            opacity: 0.45;

            pointer-events: none;

            z-index: 0;

            animation: floatOrb 18s ease-in-out infinite;
        }


        .orb-1 {

            width: 440px;
            height: 440px;

            background:
                radial-gradient(
                    circle,
                    rgba(93, 102, 200, 0.28),
                    rgba(238, 240, 255, 0)
                );

            top: -140px;
            left: -140px;
        }


        .orb-2 {

            width: 380px;
            height: 380px;

            background:
                radial-gradient(
                    circle,
                    rgba(37, 42, 104, 0.20),
                    rgba(238, 240, 255, 0)
                );

            bottom: -120px;
            right: -120px;

            animation-delay: -6s;
        }


        .orb-3 {

            width: 300px;
            height: 300px;

            background:
                radial-gradient(
                    circle,
                    rgba(124, 136, 232, 0.22),
                    rgba(93, 102, 200, 0)
                );

            top: 45%;
            left: 12%;

            animation-delay: -10s;

            opacity: 0.28;
        }


        @keyframes floatOrb {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(35px, -35px) scale(1.08);
            }

            66% {
                transform: translate(-25px, 25px) scale(0.95);
            }

        }


        /* ============================================================
           REGISTER SECTION
        ============================================================ */

        .register-section {

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 50px 20px;

            position: relative;

            z-index: 1;
        }


        /* ============================================================
           REGISTER CARD
        ============================================================ */

        .register-card {

            width: 100%;

            max-width: 500px;

            background: rgba(255, 255, 255, 0.88);

            backdrop-filter: blur(28px);

            -webkit-backdrop-filter: blur(28px);

            padding: 52px 48px 44px;

            border-radius: 44px;

            border: 1px solid rgba(226, 228, 240, 0.85);

            box-shadow:

                0 40px 80px -30px rgba(17, 20, 57, 0.18),

                0 20px 40px -20px rgba(93, 102, 200, 0.12),

                inset 0 1px 0 rgba(255, 255, 255, 0.95);

            position: relative;

            overflow: hidden;
        }


        /* ============================================================
           CARD TOP GLOW
        ============================================================ */

        .register-card::before {

            content: "";

            position: absolute;

            top: -120px;
            right: -120px;

            width: 320px;
            height: 320px;

            background:
                radial-gradient(
                    circle,
                    rgba(93, 102, 200, 0.18),
                    transparent 70%
                );

            border-radius: 50%;

            pointer-events: none;
        }


        /* ============================================================
           CARD BOTTOM GLOW
        ============================================================ */

        .register-card::after {

            content: "";

            position: absolute;

            bottom: -140px;
            left: -140px;

            width: 340px;
            height: 340px;

            background:
                radial-gradient(
                    circle,
                    rgba(124, 136, 232, 0.14),
                    transparent 70%
                );

            border-radius: 50%;

            pointer-events: none;
        }


        /* ============================================================
           BRAND
        ============================================================ */

        .brand {

            text-align: center;

            margin-bottom: 28px;

            position: relative;

            z-index: 1;
        }


        .brand-icon {

            width: 74px;
            height: 74px;

            margin: 0 auto 16px;

            border-radius: 26px;

            background:
                linear-gradient(
                    145deg,
                    #111439 0%,
                    #252A68 55%,
                    #5D66C8 100%
                );

            color: #FFFFFF;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 26px;

            font-weight: 800;

            letter-spacing: 0.5px;

            box-shadow:

                0 18px 34px -10px rgba(17, 20, 57, 0.38),

                0 8px 18px -8px rgba(93, 102, 200, 0.28),

                inset 0 2px 8px rgba(255, 255, 255, 0.18);

            animation: brandPulse 4s ease-in-out infinite;
        }


        @keyframes brandPulse {

            0%,
            100% {

                box-shadow:

                    0 18px 34px -10px rgba(17, 20, 57, 0.38),

                    0 8px 18px -8px rgba(93, 102, 200, 0.28),

                    inset 0 2px 8px rgba(255, 255, 255, 0.18);
            }

            50% {

                box-shadow:

                    0 24px 44px -10px rgba(93, 102, 200, 0.30),

                    0 12px 26px -8px rgba(37, 42, 104, 0.20),

                    inset 0 2px 8px rgba(255, 255, 255, 0.28);
            }

        }


        .brand-name {

            font-size: 15px;

            font-weight: 800;

            letter-spacing: 2px;

            text-transform: uppercase;

            background:
                linear-gradient(
                    135deg,
                    #111439,
                    #252A68 60%,
                    #5D66C8
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            background-clip: text;
        }


        /* ============================================================
           TITLES
        ============================================================ */

        .register-title {

            text-align: center;

            font-size: 34px;

            font-weight: 800;

            letter-spacing: -1px;

            margin: 0 0 10px;

            color: #111439;

            position: relative;

            z-index: 1;

            line-height: 1.15;
        }


        .register-title span {

            background:
                linear-gradient(
                    135deg,
                    #252A68,
                    #5D66C8 60%,
                    #7C88E8
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            background-clip: text;
        }


        .register-subtitle {

            text-align: center;

            margin: 0 0 34px;

            color: #686D88;

            font-size: 14px;

            font-weight: 500;

            line-height: 1.6;

            position: relative;

            z-index: 1;
        }


        /* ============================================================
           FORM
        ============================================================ */

        .form-group {

            margin-bottom: 20px;

            position: relative;

            z-index: 1;
        }


        .form-label {

            display: flex;

            align-items: center;

            gap: 6px;

            margin-bottom: 10px;

            font-size: 13px;

            font-weight: 700;

            color: #111439;

            letter-spacing: 0.2px;
        }


        .form-label::before {

            content: "";

            width: 5px;

            height: 5px;

            background:
                linear-gradient(
                    135deg,
                    #252A68,
                    #5D66C8
                );

            border-radius: 50%;

            display: inline-block;

            box-shadow:
                0 2px 6px rgba(93, 102, 200, 0.35);
        }


        /* ============================================================
           INPUT
        ============================================================ */

        .form-input {

            width: 100%;

            height: 54px;

            padding: 0 20px;

            border: 1px solid #E2E4F0;

            border-radius: 18px;

            background: #F8F8F9;

            color: #111439;

            font-size: 15px;

            font-weight: 500;

            outline: none;

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.25s ease;

            font-family: inherit;

            box-shadow:
                inset 0 1px 3px rgba(17, 20, 57, 0.03),

                0 2px 8px -4px rgba(17, 20, 57, 0.08);
        }


        .form-input::placeholder {

            color: #9699AE;

            font-weight: 400;
        }


        .form-input:hover {

            background: #FFFFFF;

            border-color: #D3D6EA;
        }


        .form-input:focus {

            background: #FFFFFF;

            border-color: #5D66C8;

            box-shadow:

                0 0 0 4px rgba(93, 102, 200, 0.12),

                0 8px 18px -8px rgba(37, 42, 104, 0.16);
            
            transform: translateY(-1px);
        }


        /* ============================================================
           CREATE BUTTON
        ============================================================ */

        .create-btn {

            width: 100%;

            height: 56px;

            margin-top: 10px;

            border: none;

            border-radius: 40px;

            background:
                linear-gradient(
                    135deg,
                    #111439 0%,
                    #252A68 55%,
                    #5D66C8 100%
                );

            color: #FFFFFF;

            font-size: 15px;

            font-weight: 800;

            letter-spacing: 0.6px;

            cursor: pointer;

            font-family: inherit;

            box-shadow:

                0 18px 34px -10px rgba(17, 20, 57, 0.38),

                0 8px 20px -8px rgba(93, 102, 200, 0.30),

                inset 0 2px 6px rgba(255, 255, 255, 0.15);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

            position: relative;

            z-index: 1;

            overflow: hidden;
        }


        .create-btn::before {

            content: "";

            position: absolute;

            top: 0;

            left: -100%;

            width: 100%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.22),
                    transparent
                );

            transition: left 0.7s ease;
        }


        .create-btn:hover::before {

            left: 100%;
        }


        .create-btn:hover {

            transform: translateY(-3px);

            box-shadow:

                0 26px 46px -10px rgba(17, 20, 57, 0.32),

                0 12px 28px -8px rgba(93, 102, 200, 0.28),

                inset 0 2px 6px rgba(255, 255, 255, 0.20);
        }


        .create-btn:active {

            transform: translateY(-1px);
        }


        /* ============================================================
           ERROR / MESSAGE
        ============================================================ */

        .error-message {

            background: #FFF1F1;

            color: #C23B3B;

            border: 1px solid #F4D6D6;

            padding: 14px 18px;

            border-radius: 16px;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 22px;

            text-align: center;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            position: relative;

            z-index: 1;

            box-shadow:
                0 6px 16px -8px rgba(194, 59, 59, 0.20);
        }


        .error-message::before {

            content: "⚠";

            font-size: 15px;
        }


        /* ============================================================
           LOGIN LINK
        ============================================================ */

        .login-link {

            text-align: center;

            margin-top: 26px;

            padding-top: 24px;

            border-top: 1px dashed #E2E4F0;

            font-size: 14px;

            color: #686D88;

            font-weight: 500;

            position: relative;

            z-index: 1;
        }


        .login-link a {

            color: #252A68;

            font-weight: 800;

            text-decoration: none;

            margin-left: 4px;

            transition: color 0.2s ease;

            position: relative;
        }


        .login-link a::after {

            content: "";

            position: absolute;

            left: 0;

            bottom: -2px;

            width: 100%;

            height: 1.5px;

            background:
                linear-gradient(
                    90deg,
                    #252A68,
                    #5D66C8
                );

            transform: scaleX(0);

            transform-origin: left;

            transition: transform 0.3s ease;
        }


        .login-link a:hover {

            color: #5D66C8;
        }


        .login-link a:hover::after {

            transform: scaleX(1);
        }


        /* ============================================================
           RESPONSIVE
        ============================================================ */

        @media (max-width: 520px) {

            .register-section {

                padding: 30px 16px;
            }


            .register-card {

                padding: 36px 26px 30px;

                border-radius: 34px;
            }


            .brand-icon {

                width: 62px;

                height: 62px;

                font-size: 22px;

                border-radius: 22px;
            }


            .register-title {

                font-size: 26px;
            }


            .register-subtitle {

                margin-bottom: 26px;
            }


            .form-input {

                height: 50px;

                font-size: 14px;

                border-radius: 16px;
            }


            .create-btn {

                height: 52px;

                font-size: 14px;
            }


            .login-link {

                margin-top: 22px;

                padding-top: 20px;
            }

        }

    </style>

</head>


<body>


    <!-- ANIMATED BACKGROUND ORBS -->

    <div class="orb orb-1"></div>

    <div class="orb orb-2"></div>

    <div class="orb orb-3"></div>


    <!-- REGISTER SECTION -->

    <section class="register-section">

        <div class="register-card">


            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">
                    AI
                </div>

                <p class="brand-name">
                    Backorder AI
                </p>

            </div>


            <!-- TITLE -->

            <h1 class="register-title">
                Create <span>User</span>
            </h1>


            <p class="register-subtitle">
                Create your account to get started
            </p>


            <!-- MESSAGES -->

            {% if messages %}

                {% for message in messages %}

                    <div class="error-message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}


            <!-- FORM -->

            <form method="POST">

                {% csrf_token %}


                <!-- USERNAME -->

                <div class="form-group">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        class="form-input"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-input"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-input"
                        placeholder="Enter your password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label class="form-label">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        class="form-input"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- CREATE BUTTON -->

                <button
                    type="submit"
                    class="create-btn"
                >
                    Create User
                </button>

            </form>


            <!-- LOGIN LINK -->

            <div class="login-link">

                Already have an account?

                <a href="{% url 'login' %}">
                    Login
                </a>

            </div>


        </div>

    </section>


</body>

</html>
